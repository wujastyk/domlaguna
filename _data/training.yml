# ---------------------------------------------------------------------------

- school: "Private Study & Woodshedding"
  summary: "Years of self-directed and mentored practice across jazz walking bass, blues shuffles, and rock groove playing."
  detail: >-
    Studied jazz harmony and walking bass construction with several wonderful
    private teachers, including Steve Lawson, Tiago Coimbra, Ed Friedland, Todd
    Johnson, and Sean Croal. Transcribed blues and rock bass lines by ear, and
    logged many hours playing along to records to lock in time and feel. Mostly,
    I've grown through playing with friends in bands and combos.

- school: "Recent courses"
  summary: "Workshops, summer schools, and ensemble programs in jazz performance, theory, and history."
  detail: >-
    In 2002 I attended a three-week music intensive in Santiago de Cuba. For
    several years I was a regular attendee at the wonderful
    [Cambridge Jazz Co-op](https://cambridgejazzcoop.org.uk/wp/) (UK). I have had
    the privilege of attending jazz workshops and summer schools with Jamie
    Aebersold (London), with Stefan Redtenbacher at the
    [Academy of Contemporary Music](https://www.acm.ac.uk/) (Guildford), the jazz
    summer school at MacEwan University (Edmonton, Canada), and the
    [JazzWire Summit](https://www.jazzwire.net/) (Edmonton). All were hugely
    enjoyable and musically transformative in different ways. In recent years
    I've been learning jazz history, music theory, and ensemble performance
    through the online [Scott's Bass Lessons programs](https://scottsbasslessons.com) and especially th
    [Jazz Combo program at the Winspear Theatre](https://www.winspearcentre.com/learning/adult-learning-programs/conservatory-jazz-combos/),
    Edmonton, under the leadership of Dan Davis.
