    <circle cx="1190" cy="184" r="10"/>
    <circle cx="1232" cy="179" r="10"/>
    <circle cx="1274" cy="174" r="10"/>
    <circle cx="1316" cy="169" r="10"/>
    <path d="M 1190 194 L 1190 212 M 1232 189 L 1232 207 M 1274 184 L 1274 203 M 1316 179 L 1316 205"/>

    <!-- frets -->
    <path d="M 1080 229 L 1080 257 M 1016 230 L 1016 256 M 956 230 L 956 256
