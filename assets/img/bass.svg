    <circle cx="823"  cy="243" r="4" fill="#111827" stroke="none"/>
    <circle cx="728"  cy="243" r="4" fill="#111827" stroke="none"/>
    <circle cx="606"  cy="237" r="4" fill="#111827" stroke="none"/>
    <circle cx="606"  cy="250" r="4" fill="#111827" stroke="none"/>

